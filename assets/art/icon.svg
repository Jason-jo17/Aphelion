<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Aphelion: the far point of an orbit. The marker sits at apoapsis. -->
  <rect width="128" height="128" rx="24" fill="#0b0d14"/>
  <ellipse cx="74" cy="64" rx="46" ry="30" fill="none" stroke="#4cc2ff"
           stroke-width="3" stroke-dasharray="10 6" opacity="0.85"/>
  <circle cx="86" cy="64" r="13" fill="#3f6fa8"/>
  <circle cx="86" cy="64" r="13" fill="none" stroke="#6f9fd0" stroke-width="1.5"/>
  <g stroke="#ffd166" stroke-width="3.5" stroke-linecap="round">
    <line x1="22" y1="56" x2="34" y2="68"/>
    <line x1="34" y1="56" x2="22" y2="68"/>
  </g>
</svg>
