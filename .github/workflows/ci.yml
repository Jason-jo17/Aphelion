name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this before exporting: a release that fails its own tests
  # is not a release.
  workflow_call:

env:
  GODOT_VERSION: "4.7.2"
  GUT_VERSION: "9.7.1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The reference simulation is plain Python with no dependencies, so it runs in
  # seconds and catches most physics mistakes before a Godot job is even started.
  reference-sim:
    name: reference simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Numerical checks (conservation, closure, accuracy)
        run: python3 tools/refsim/validate_physics.py

      - name: Stock ships still balance
        run: python3 tools/refsim/ships.py

      - name: Every reference solution still flies
        run: python3 tools/refsim/author_missions.py

      - name: Mission files match the authoring tool
        run: |
          python3 tools/refsim/author_missions.py --write
          if ! git diff --quiet -- missions; then
            echo "::error::missions/ is stale. Run:"
            echo "  python3 tools/refsim/author_missions.py --write"
            git --no-pager diff --stat -- missions
            exit 1
          fi

      - name: Fixtures are up to date with the reference
        run: |
          python3 tools/refsim/generate_fixtures.py
          if ! git diff --quiet -- tests/fixtures; then
            echo "::error::tests/fixtures is stale. Run tools/refsim/generate_fixtures.py"
            echo "and commit the result alongside your physics change."
            git --no-pager diff --stat -- tests/fixtures
            exit 1
          fi

  data:
    name: data files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every JSON file parses
        run: |
          fail=0
          for f in $(git ls-files '*.json'); do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::invalid JSON"; fail=1; }
          done
          exit $fail

  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin && cd ~/godot-bin
          NAME="Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${NAME}.zip"
          unzip -q godot.zip
          mv "$NAME" godot
          chmod +x godot

      - name: Fetch GUT
        run: ./tools/fetch_gut.sh

      - name: Import project
        # The first headless run builds .godot/; it exits non-zero on some
        # versions even when the import succeeded, so the result is checked by
        # looking for the directory rather than by the exit code.
        run: |
          ~/godot-bin/godot --headless --import --quit-after 200 || true
          test -d .godot || { echo "::error::project import produced no .godot/"; exit 1; }

      - name: Run GUT
        run: |
          set -o pipefail
          ~/godot-bin/godot --headless \
            -s addons/gut/gut_cmdln.gd \
            -gdir=res://tests \
            -ginclude_subdirs \
            -gprefix=test_ \
            -gsuffix=.gd \
            -gexit \
            -glog=1 \
            -gjunit_xml_file=res://gut-results.xml | tee gut.log

          # GUT only *warns* when a test script fails to parse, and still exits
          # zero. That once hid two whole files — test_integrator.gd and
          # test_controller_vm.gd called assert_le(), which GUT spells
          # assert_lte() — so the suite reported green while the integrator was
          # not being tested at all. A skipped file is a failure here.
          if grep -qE 'Ignoring script|Failed to load script' gut.log; then
            echo "::error::GUT skipped a test script; see the log above."
            grep -E 'Ignoring script|Failed to load script' gut.log
            exit 1
          fi

          # Likewise: every tests/**/test_*.gd must have been collected.
          on_disk=$(find tests -name 'test_*.gd' | wc -l)
          collected=$(grep -oE '^Scripts +[0-9]+' gut.log | grep -oE '[0-9]+')
          if [ "$on_disk" != "$collected" ]; then
            echo "::error::$on_disk test scripts on disk but GUT ran $collected."
            exit 1
          fi

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-results
          path: gut-results.xml
          if-no-files-found: warn

  # AC1 says the same ship, program and seed must produce the identical
  # trajectory across operating systems. This is the job that proves it: the
  # same fifteen flights on three platforms, compared hash by hash.
  # Every test in the suite above passes with no frame ever drawn. This is the
  # job that notices a screen throwing while it builds — which, the first time
  # it was run, was three screens.
  ui-smoke:
    name: every screen builds and draws
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/godot-bin
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Install Godot and a virtual display
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          if [ ! -x ~/godot-bin/godot ]; then
            mkdir -p ~/godot-bin && cd ~/godot-bin
            curl -fsSL -o godot.zip \
              "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
            unzip -q godot.zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
            chmod +x godot
          fi

      - name: Import project
        run: |
          ~/godot-bin/godot --headless --import --quit-after 200 || true
          test -d .godot

      - name: Drive every screen
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" \
            ~/godot-bin/godot --path . --rendering-driver opengl3 \
            res://tools/capture_screens.tscn 2>&1 | tee ui.log

          # Audio and MSAA complain on a headless runner and neither matters.
          # A SCRIPT ERROR is GDScript throwing while a screen is being built,
          # which is the whole point of this job.
          if grep -q 'SCRIPT ERROR' ui.log; then
            echo "::error::a screen threw while building; see the log above"
            grep -B2 -A6 'SCRIPT ERROR' ui.log
            exit 1
          fi
          test "$(ls assets/screenshots/*.png | wc -l)" -eq 5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: assets/screenshots/*.png

  determinism:
    name: determinism (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux.x86_64
            binary: godot
          - os: macos-latest
            asset: macos.universal
            binary: "Godot.app/Contents/MacOS/Godot"
          - os: windows-latest
            asset: win64.exe
            binary: "Godot_v4.7.2-stable_win64.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "$HOME/godot-bin" && cd "$HOME/godot-bin"
          NAME="Godot_v${GODOT_VERSION}-stable_${{ matrix.asset }}"
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/${NAME}.zip"
          unzip -q godot.zip
          if [ -d "Godot.app" ]; then
            chmod +x "${{ matrix.binary }}"
          else
            mv "$NAME" godot && chmod +x godot
          fi

      - name: Install Godot (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$HOME/godot-bin" | Out-Null
          Set-Location "$HOME/godot-bin"
          $name = "Godot_v$env:GODOT_VERSION-stable_${{ matrix.asset }}"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot-builds/releases/download/$env:GODOT_VERSION-stable/$name.zip" -OutFile godot.zip
          Expand-Archive godot.zip -DestinationPath .

      - name: Import project
        shell: bash
        run: |
          "$HOME/godot-bin/${{ matrix.binary }}" --headless --import --quit-after 200 || true
          test -d .godot || { echo "::error::project import produced no .godot/"; exit 1; }

      - name: Fly every reference solution
        shell: bash
        run: |
          "$HOME/godot-bin/${{ matrix.binary }}" --headless \
            --script res://tools/determinism_check.gd \
            -- --json "$PWD/determinism-${{ matrix.os }}.json" \
            | tee determinism-${{ matrix.os }}.txt

      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: |
            determinism-${{ matrix.os }}.json
            determinism-${{ matrix.os }}.txt

  cross-platform-determinism:
    name: same bits on every platform
    needs: determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: determinism-*
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the three reports
        run: python3 tools/compare_determinism.py determinism-*.json

  format:
    name: gdscript formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==4.*"
      - name: gdformat --check
        run: gdformat --check $(git ls-files '*.gd')
      - name: gdlint
        # Advisory on purpose: a style opinion should not block a physics fix.
        # It is clean as of this writing — `.gdlintrc` relaxes the handful of
        # defaults that disagree with this project's house style, and says why.
        continue-on-error: true
        run: gdlint $(git ls-files '*.gd')
