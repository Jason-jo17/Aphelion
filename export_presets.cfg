; Export presets for the three desktop targets.
;
; Kept in version control so a release is reproducible and so the CI matrix does
; not have to reconstruct them. Signing and notarisation are deliberately left
; off here — see .github/workflows/release.yml and docs/PACKAGING.md.

[preset.0]

name="Linux"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/refsim/*, tests/*, addons/gut/*, docs/*"
export_path="dist/linux/Aphelion.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="Windows"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/refsim/*, tests/*, addons/gut/*, docs/*"
export_path="dist/windows/Aphelion.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.1.options]

binary_format/architecture="x86_64"
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
application/product_name="Aphelion"
application/file_description="Aphelion — orbital mechanics puzzle game"
application/company_name="Aphelion contributors"
application/copyright="MIT licensed. See LICENSE."
codesign/enable=false

[preset.2]

name="macOS"
platform="macOS"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="tools/refsim/*, tests/*, addons/gut/*, docs/*"
export_path="dist/macos/Aphelion.zip"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.2.options]

export/distribution_type=0
binary_format/architecture="universal"
application/bundle_identifier="org.aphelion.game"
application/copyright="MIT licensed. See LICENSE."
application/short_version="0.1.0"
application/version="0.1.0"
display/high_res=true
; Ad-hoc signing only. Identity-based signing and notarisation need secrets
; this repository does not have; docs/PACKAGING.md explains how to add them.
codesign/codesign=1
notarization/notarization=0
